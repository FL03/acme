[package]
build = "build.rs"
name = "acme"

authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = false
features = ["default"]
rustc-args = [ "--cfg", "docsrs" ]
version = "v{{version}}"

[package.metadata.release]
no-dev-version = true
tag-name = "v{{version}}"

# ************* [Benchmarks] *************
[[bench]]
harness = false
name = "default"

# ************* [Examples] *************
[[example]]
name = "basic"
required-features = [
  "engine",
  "std",
  "tracing",
]

[lib]
path = "lib.rs"

[dependencies]
acme-core = { workspace = true }
acme-engine = { optional = true, workspace = true }

[dev-dependencies]
anyhow = { features = ["std"], workspace = true }
criterion = { features = ["plotters"], workspace = true }
lazy_static = { workspace = true }
tokio = { features = ["full"], workspace = true }
tracing = { features = ["log"], workspace = true }
tracing-subscriber = { features = ["ansi"], workspace = true }

[features]
default = [
  "engine",
  "std",
]

full = [
  "default",
  "chrono",
  "json",
  "serde",
  "time",
  "tokio",
  "tracing",
  "uuid",
]

# ************* [FF:Features] *************

engine = [
  "dep:acme-engine",
  "std",
]

json = [
  "alloc",
  "serde",
  "serde_json",
  "acme-core/json",
  "acme-engine?/json",
]

time = [
  "acme-core/time",
  "acme-engine?/time",
  "chrono",
  "time_1",
]

# ********* [FF:Environments] *********
nightly = [
  "acme-core/nightly",
  "acme-engine?/nightly",
]

std = [
  "alloc",
  "acme-core/std",
  "acme-engine?/std",
]

wasi = [
  "alloc",
  "acme-core/wasi",
  "acme-engine?/wasi",
]

wasm = [
  "alloc",
  "acme-core/wasm",
  "acme-engine?/wasm",
]

# ************* [FF:Dependencies] *************
alloc = [
  "acme-core/alloc",
  "acme-engine?/alloc",
]

chrono = [
  "acme-core/chrono",
  "acme-engine?/chrono",
]

rand = [
  "rng",
  "acme-core/rand",
  "acme-engine?/rand",
]

rng = [
  "acme-core/rng",
  "acme-engine?/rng",
]

serde = [
  "acme-core/serde",
  "acme-engine?/serde",
]

serde_json = [
  "acme-core/serde_json",
  "acme-engine?/serde_json",
]

time_1 = [
  "acme-core/time_1",
  "acme-engine?/time_1",
]

tokio = [
  "acme-engine?/tokio",
]

tracing = [
  "acme-core/tracing",
  "acme-engine?/tracing",
]

uuid = [
  "acme-core/uuid",
  "acme-engine?/uuid",
]

wasm_bindgen = [
  "acme-core/wasm_bindgen",
  "acme-engine?/wasm_bindgen",
]
